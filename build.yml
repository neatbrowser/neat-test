name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The ad blocker's dll and filter lists (tools/fetch-ads.ps1). If they cannot be fetched the
      # build goes on without them and the app runs without a blocker.
      - name: Fetch ad blocker files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/fetch-ads.ps1

      # The two checks below are new and have not run on a real machine yet, so for now a failure
      # shows as a warning and does not stop the build. Remove continue-on-error once they pass.
      - name: Ad blocker self-check
        continue-on-error: true
        run: dotnet run --project tests/ads.check --configuration Release

      - name: Ad blocker page script check
        continue-on-error: true
        run: node tests/ads.check/page.check.mjs

      - name: Restore
        run: dotnet restore src/neat/neat.csproj -p:Platform=x64

      - name: Build
        run: dotnet build src/neat/neat.csproj --configuration Release --no-restore -p:Platform=x64

      # Produces a plain folder with neat.exe that runs on its own
      # (self-contained, unpackaged, with the bundled WebView2 runtime).
      - name: Publish
        run: dotnet publish src/neat/neat.csproj --configuration Release --no-build -p:Platform=x64 --output publish

      - name: Report whether the ad blocker is in the build
        shell: pwsh
        run: |
          if ((Test-Path publish/neat_adblock.dll) -and (Test-Path publish/filters/manifest.json)) {
            Write-Host 'ad blocker: bundled'
          } else {
            Write-Warning 'ad blocker: NOT bundled in this build'
          }

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: neat-win-x64
          path: publish
          retention-days: 7
